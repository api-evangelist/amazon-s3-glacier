name: Amazon S3 Glacier

description: Amazon S3 Glacier is a secure, durable, and extremely low-cost Amazon S3 storage class purpose-built for long-term data archiving
  and digital preservation. It provides comprehensive security and compliance capabilities that can help meet even the most stringent regulatory
  requirements, with retrieval options ranging from minutes to hours depending on your access needs.

